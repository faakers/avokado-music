<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avokado Bar · Müzik</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#243420">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#1a2417; --panel:#243420; --panel2:#2d4027;
    --green:#8fbc5a; --green-dk:#5a8a3a; --cream:#f2efe6; --muted:#9db08d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--cream);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .app{width:100%; max-width:540px;}
  .card{background:var(--panel); border-radius:20px; padding:28px; box-shadow:0 10px 40px rgba(0,0,0,.4);}
  h1{font-size:22px; letter-spacing:.5px; display:flex; align-items:center; gap:10px;}
  h1 .avo{font-size:28px;}
  .clock{font-variant-numeric:tabular-nums; font-size:44px; font-weight:600; margin:14px 0 2px;}
  .slot-name{color:var(--green); font-size:17px; font-weight:600; min-height:24px;}
  .slot-sub{color:var(--muted); font-size:13px; margin-top:2px; min-height:18px;}
  .moods{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
  .mood{
    border:1px solid var(--panel2); background:transparent; color:var(--muted);
    border-radius:999px; padding:6px 12px; font-size:12.5px; cursor:pointer; transition:.15s;
  }
  .mood:hover{color:var(--cream); border-color:var(--green-dk);}
  .mood.active{background:var(--green-dk); color:var(--cream); border-color:var(--green-dk);}
  .now{margin-top:16px; background:var(--panel2); border-radius:14px; padding:16px; min-height:76px;}
  .now-top{display:flex; align-items:center; gap:14px;}
  .eq{display:flex; gap:3px; align-items:flex-end; height:26px; width:26px; flex:none;}
  .eq span{width:5px; background:var(--green); border-radius:2px; height:6px;}
  .playing .eq span{animation:eq .9s ease-in-out infinite;}
  .playing .eq span:nth-child(2){animation-delay:.2s;}
  .playing .eq span:nth-child(3){animation-delay:.4s;}
  @keyframes eq{0%,100%{height:6px}50%{height:24px}}
  .track-title{font-size:15px; font-weight:600;}
  .track-sub{font-size:12px; color:var(--muted); margin-top:3px;}
  .seek-row{display:flex; align-items:center; gap:10px; margin-top:12px; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .seek-row input[type=range]{flex:1; accent-color:var(--green); height:4px;}
  .controls{display:flex; gap:10px; margin-top:16px;}
  button{
    flex:1; border:0; border-radius:12px; padding:14px; font-size:15px; font-weight:600;
    cursor:pointer; background:var(--panel2); color:var(--cream); transition:.15s;
  }
  button:hover{filter:brightness(1.15);}
  button.primary{background:var(--green-dk);}
  button.primary:hover{background:var(--green);color:#152010;}
  button:disabled{opacity:.5; cursor:default;}
  button.small{flex:none; padding:14px 16px; font-size:14px;}
  .subrow{gap:8px; margin-top:8px; justify-content:flex-start;}
  .subrow button{padding:9px 12px; font-size:12.5px; font-weight:500;}
  button.mini{margin-left:auto; background:transparent; border:1px solid var(--panel2); color:var(--muted); font-size:11.5px; padding:9px 10px;}
  button.mini:hover{color:var(--cream); border-color:#7a4a3a;}
  .license{display:none; margin-top:14px; background:var(--panel2); border-radius:12px; padding:14px; font-size:12.5px; line-height:1.8; color:var(--muted);}
  .license.open{display:block;}
  .license b{color:var(--cream);}
  .license a{color:var(--green);}
  .vol{display:flex; align-items:center; gap:12px; margin-top:16px; font-size:13px; color:var(--muted);}
  input[type=range]{flex:1; accent-color:var(--green);}
  .schedule{margin-top:18px; font-size:12.5px; color:var(--muted); line-height:1.9;}
  .schedule .row{display:flex; justify-content:space-between; padding:0 4px; border-radius:6px;}
  .schedule .row.active{background:var(--panel2); color:var(--cream);}
  .schedule .row.active .tag{color:var(--green);}
  .foot{margin-top:14px; font-size:11.5px; color:var(--muted); text-align:center; line-height:1.6;}
  .big{padding:40px 0; text-align:center;}
  .big p{color:var(--muted); font-size:15px; margin:16px 0 22px; line-height:1.6;}
  .err{color:#e0a05a; font-size:13px; margin-top:10px; text-align:center; min-height:18px;}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1><span class="avo">🥑</span> Avokado Bar · Müzik</h1>

    <!-- AÇILIŞ -->
    <div id="intro" class="big">
      <div class="clock" id="clockIntro">--:--</div>
      <p id="introText">Müzik listesi yükleniyor…</p>
      <button class="primary" id="startBtn" disabled>▶ Başlat</button>
      <div class="err" id="err"></div>
    </div>

    <!-- PLAYER -->
    <div id="player" hidden>
      <div class="clock" id="clock">--:--</div>
      <div class="slot-name" id="slotName"></div>
      <div class="slot-sub" id="slotSub"></div>

      <div class="moods" id="moods"></div>

      <div class="now" id="nowBox">
        <div class="now-top">
          <div class="eq"><span></span><span></span><span></span></div>
          <div>
            <div class="track-title" id="trackTitle">—</div>
            <div class="track-sub" id="trackSub"></div>
          </div>
        </div>
        <div class="seek-row">
          <span id="tCur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0">
          <span id="tDur">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="primary" id="toggleBtn">⏸ Durdur</button>
        <button id="skipBtn">⏭ Sonraki</button>
      </div>
      <div class="controls subrow">
        <button class="small" id="licBtn" title="Çalan parçanın lisansı">Lisans</button>
        <button class="small" id="disListBtn" title="Beğenilmeyenler listesi">Liste</button>
        <button class="small mini" id="dislikeBtn" title="Bu parçayı beğenmedim: listeye ekle, geç, bir daha çalma">👎 Beğenmedim</button>
      </div>

      <div class="license" id="licPanel"></div>
      <div class="license" id="disPanel"></div>

      <div class="vol">🔊 <input type="range" id="vol" min="0" max="100" value="80"> <span id="volLabel">80%</span></div>

      <div class="schedule" id="schedule"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>

<audio id="a0" preload="auto" crossorigin="anonymous"></audio>
<audio id="a1" preload="auto" crossorigin="anonymous"></audio>

<script>
// ---------- SERVICE WORKER (cache) ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ---------- EKRANI AÇIK TUT + UYKUDAN DÖNÜNCE DEVAM ET ----------
let wakeLock = null;
async function acquireWakeLock(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState === 'visible'){
    acquireWakeLock();
    // ekran/uyku sonrası çalma durduysa kaldığı dilimden devam et
    if (started){
      const anyPlaying = audios.some(a=>!a.paused && a.src);
      if (effectiveIdx() !== -1 && !anyPlaying) playNext();
    }
  }
});

// ---------- ZAMAN PLANI ----------
// [başlangıç dk, bitiş dk, klasör anahtarı, ad, açıklama, hedef ses (0-1)]
const SLOTS = [
  [8*60,      12*60,     '1-kahvalti', 'Kahvaltı', 'Akustik & soft — 60-90 BPM',        0.70],
  [12*60,     14*60+30,  '2-ogle',     'Öğle',     'Enerjik & upbeat — 100-120 BPM',    0.85],
  [14*60+30,  17*60,     '3-ikindi',   'İkindi',   'Bossa & chill — 70-95 BPM',         0.70],
  [17*60,     20*60,     '4-aksam',    'Akşam',    'Nu-jazz & groove — 90-110 BPM',     0.75],
  [20*60,     21*60,     '5-kapanis',  'Geçiş',    'Lounge & sakin — 75-95 BPM',        0.60],
  [21*60,     23*60,     '6-hifi',     'HiFi',     'Kahve & tatlı — funk, groove, 100-120 BPM', 0.70],
];
const FADE_SEC = 4;

// ---------- DURUM ----------
let library = {};
let started = false;
let mood = 'auto';
let currentSlotIdx = -1;
let currentTrack = null;
let queue = [], queuePos = 0;
let active = 0, masterVol = 0.8, seeking = false;
let gen = 0, fadeIv = null, lastStart = 0, failCount = 0;
let lastManifestFetch = 0;
const audios = [document.getElementById('a0'), document.getElementById('a1')];

// ---------- DOSYA ADI AYRIŞTIRMA ----------
function parseTrack(path){
  const filename = decodeURIComponent(path.split('/').pop());
  let base = filename.replace(/\.(mp3|m4a|ogg|wav)$/i,'');
  const pxm = base.match(/\[px(\d+)\]/);
  const vokal = /\[vokal\]/i.test(base);
  const brackets = [...base.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]).filter(b=>!/^px\d+$/.test(b) && b.toLowerCase()!=='vokal');
  const artist = brackets.length ? brackets[brackets.length-1] : null;
  let title = base.replace(/^\d-\w+ - /,'').replace(/\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim();
  return { title, artist, pxid: pxm?pxm[1]:null, vokal };
}

// ---------- MANIFEST (playlist) ----------
async function loadManifest(){
  const res = await fetch('manifest.json?t=' + Date.now(), {cache:'no-store'});
  if (!res.ok) throw new Error('manifest ' + res.status);
  const data = await res.json();
  const lib = {};
  let total = 0;
  for (const s of SLOTS){
    const paths = data[s[2]] || [];
    lib[s[2]] = paths.map(p => {
      const meta = parseTrack(p);
      return { name: meta.title, artist: meta.artist, pxid: meta.pxid, vokal: meta.vokal,
               file: decodeURIComponent(p.split('/').pop()), url: encodeURI(p) };
    });
    total += lib[s[2]].length;
  }
  library = lib;
  lastManifestFetch = Date.now();
  return total;
}

// ---------- YARDIMCILAR ----------
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const slotIdxFor = m => SLOTS.findIndex(s => m >= s[0] && m < s[1]);
const effectiveIdx = () => mood === 'auto' ? slotIdxFor(nowMin()) : mood;
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const fmtSec = s => isFinite(s) ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '0:00';
function tracksFor(idx){
  const pref = SLOTS[idx][2];
  const pool = (library[pref] && library[pref].length) ? library[pref] : Object.values(library).flat();
  const kept = pool.filter(t => !dislikes.has(t.file));
  return kept.length ? kept : pool; // hepsi beğenilmediyse yine de çal (sessizlik olmasın)
}

function setMediaMeta(track, idx){
  if ('mediaSession' in navigator){
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.name || track.file,
        artist: track.artist || 'Avokado Bar',
        album: SLOTS[idx][3] + ' · Avokado Bar'
      });
      navigator.mediaSession.playbackState = 'playing';
      navigator.mediaSession.setActionHandler('nexttrack', ()=>{ if (started) playNext(); });
    } catch(e){}
  }
}

// ---------- BEĞENİLMEYENLER (cihazda saklanır) ----------
function loadDislikes(){ try{ return new Set(JSON.parse(localStorage.getItem('avokado_dislikes')||'[]')); }catch(e){ return new Set(); } }
function saveDislikes(){ try{ localStorage.setItem('avokado_dislikes', JSON.stringify([...dislikes])); }catch(e){} }
let dislikes = loadDislikes();
function renderDisCount(){
  document.getElementById('disListBtn').textContent = 'Liste (' + dislikes.size + ')';
}
function renderDisPanel(){
  const arr = [...dislikes];
  const p = document.getElementById('disPanel');
  if (!arr.length){ p.innerHTML = 'Beğenilmeyen parça yok. Bir parça çalarken 👎 Beğenmedim\'e basınca buraya eklenir.'; return; }
  p.innerHTML = '<b>Beğenilmeyen ' + arr.length + ' parça:</b><br>' + arr.map(f=>'• '+f).join('<br>') +
    '<br><br><button class="small" id="copyDis">Kopyala</button> <button class="small" id="clearDis">Listeyi temizle</button>';
  document.getElementById('copyDis').onclick = function(){
    (navigator.clipboard ? navigator.clipboard.writeText(arr.join('\n')) : Promise.reject()).then(()=>{ this.textContent='Kopyalandı ✓'; }).catch(()=>{ this.textContent='Kopyalanamadı'; });
  };
  document.getElementById('clearDis').onclick = ()=>{ if (confirm('Beğenilmeyenler listesi silinsin mi? (parçalar tekrar çalmaya başlar)')){ dislikes.clear(); saveDislikes(); renderDisCount(); renderDisPanel(); } };
}

// ---------- ÇALMA ----------
function playNext(force){
  const idx = effectiveIdx();
  if (idx === -1){ stopAll(); updateUI(); return; }
  if (idx !== currentSlotIdx || force === 'reshuffle'){
    currentSlotIdx = idx;
    queue = shuffle([...tracksFor(idx).keys()]);
    queuePos = 0;
  }
  const tracks = tracksFor(idx);
  if (!tracks.length){ updateUI(); return; }
  if (queuePos >= queue.length){ queue = shuffle(queue); queuePos = 0; }
  const track = tracks[queue[queuePos++] % tracks.length];

  const myGen = ++gen;
  lastStart = Date.now();

  // ARKA PLAN / EKRAN KAPALI: aynı ses kanalında, crossfade yok (Android izin versin)
  if (document.hidden) {
    const a = audios[active];
    if (fadeIv){ clearInterval(fadeIv); fadeIv = null; }
    a.ontimeupdate = null; a.onended = null;
    a.src = track.url;
    a.volume = SLOTS[idx][5] * masterVol;
    a.play().catch(()=>{});
    currentTrack = track;
    setMediaMeta(track, idx);
    a.onended = () => { if (myGen === gen) playNext(); };
    return;
  }

  const cur = audios[active];
  const next = audios[1-active];
  active = 1-active;
  next.ontimeupdate = null; next.onended = null;
  next.pause();
  next.src = track.url;
  next.volume = 0;
  next.play().then(()=>{
    if (myGen !== gen) return;
    failCount = 0;
    startFade(cur, next, SLOTS[idx][5]);
    currentTrack = track;
    document.getElementById('trackTitle').textContent = track.name || track.file;
    document.getElementById('trackSub').textContent =
      (track.artist ? track.artist + ' · ' : '') + SLOTS[idx][3] + ' listesi' + (track.vokal ? ' · vokal' : '');
    renderLicense();
    setMediaMeta(track, idx);
    next.onended = () => { if (myGen === gen) playNext(); };
    next.__fading = false;
    next.ontimeupdate = () => {
      if (myGen !== gen) return;
      if (!seeking) updateSeek(next);
      if (next.duration && next.duration - next.currentTime < FADE_SEC && !next.__fading){
        next.__fading = true; playNext();
      }
    };
  }).catch(()=>{
    if (myGen !== gen) return;
    failCount++;
    if (failCount < 12) setTimeout(()=>{ if (myGen===gen) playNext(); }, 800);
    else { document.getElementById('trackSub').textContent='Bağlantı hatası — internet/adres kontrol'; }
  });
}
function startFade(from, to, slotVol){
  if (fadeIv) clearInterval(fadeIv);
  const target = slotVol * masterVol;
  const steps = 20, dt = FADE_SEC*1000/steps;
  let i = 0;
  fadeIv = setInterval(()=>{
    i++;
    to.volume = Math.min(target, target*i/steps);
    if (from !== to && from.src) from.volume = Math.max(0, (from.volume||0)*(1-i/steps));
    if (i >= steps){ clearInterval(fadeIv); fadeIv=null; if(from!==to){ from.ontimeupdate=null; from.onended=null; from.pause(); from.removeAttribute('src'); } }
  }, dt);
}
function stopAll(){
  gen++;
  if (fadeIv){ clearInterval(fadeIv); fadeIv=null; }
  audios.forEach(a=>{ a.ontimeupdate=null; a.onended=null; a.pause(); a.removeAttribute('src'); });
  currentTrack = null;
  document.getElementById('trackTitle').textContent = 'Duraklatıldı';
  document.getElementById('trackSub').textContent = mood==='auto' ? 'Çalışma saatleri dışında' : 'Durduruldu';
  document.getElementById('nowBox').classList.remove('playing');
  updateSeek(null);
}

// ---------- SEEK ----------
const seekEl = document.getElementById('seek');
function updateSeek(a){
  if (!a || !a.duration){ seekEl.value=0; document.getElementById('tCur').textContent='0:00'; document.getElementById('tDur').textContent='0:00'; return; }
  seekEl.value = Math.round(a.currentTime/a.duration*1000);
  document.getElementById('tCur').textContent = fmtSec(a.currentTime);
  document.getElementById('tDur').textContent = fmtSec(a.duration);
}
seekEl.addEventListener('input', ()=>{ seeking=true; const a=audios[active]; if(a&&a.duration) document.getElementById('tCur').textContent=fmtSec(seekEl.value/1000*a.duration); });
seekEl.addEventListener('change', ()=>{ const a=audios[active]; if(a&&a.duration){ const t=seekEl.value/1000*a.duration; a.currentTime=Math.min(t, Math.max(0, a.duration-(FADE_SEC+1))); } seeking=false; });

// ---------- LİSANS ----------
document.getElementById('licBtn').onclick = ()=> document.getElementById('licPanel').classList.toggle('open');
function renderLicense(){
  const p = document.getElementById('licPanel');
  if (!currentTrack){ p.innerHTML='Bir parça çalıyor olmalı.'; return; }
  const t = currentTrack;
  const kayit = '<br><a href="lisans-kayitlari/LISANS-KAYDI.md" target="_blank">📄 Tam lisans kaydını aç</a>';
  if (t.pxid){
    p.innerHTML = '<b>'+t.name+'</b><br>Sanatçı: <b>'+(t.artist||'—')+'</b><br>Kaynak: Pixabay Music (px'+t.pxid+')<br>Lisans: <a href="https://pixabay.com/service/license-summary/" target="_blank">Pixabay Content License</a> — ticari kullanım ve mekân yayını serbest, atıf gerekmez.<br>Dosya: '+t.file+kayit;
  } else {
    p.innerHTML = '<b>'+t.name+'</b><br>'+(t.artist?'Sanatçı: <b>'+t.artist+'</b><br>':'')+'Dosya: '+t.file+kayit;
  }
}

// ---------- MOOD ----------
function renderMoods(){
  const el = document.getElementById('moods');
  const items = [['auto','⏰ Otomatik']].concat(SLOTS.map((s,i)=>[i, s[3]]));
  el.innerHTML = items.map(([v,l])=>'<button class="mood'+(String(mood)===String(v)?' active':'')+'" data-mood="'+v+'">'+l+'</button>').join('');
  el.querySelectorAll('.mood').forEach(b=>{
    b.onclick = ()=>{
      mood = b.dataset.mood==='auto' ? 'auto' : parseInt(b.dataset.mood,10);
      renderMoods();
      if (started) playNext('reshuffle');
      updateUI();
    };
  });
}

// ---------- SAAT DÖNGÜSÜ ----------
setInterval(async ()=>{
  const d = new Date();
  const hhmm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = hhmm;
  document.getElementById('clockIntro').textContent = hhmm;
  if (!started) return;
  const idx = effectiveIdx();
  const anyPlaying = audios.some(a=>!a.paused && a.src);
  const settling = Date.now() - lastStart < (FADE_SEC+2)*1000;
  if (idx === -1 && anyPlaying) stopAll();
  else if (idx !== -1 && !anyPlaying && !settling) playNext();
  else if (idx !== -1 && idx !== currentSlotIdx && !settling){
    try { if (Date.now()-lastManifestFetch > 60000) await loadManifest(); } catch(e){}
    renderSchedule();
    playNext();
  }
  updateUI();
}, 1000);

function updateUI(){
  const idx = effectiveIdx();
  const manual = mood !== 'auto';
  document.getElementById('slotName').textContent =
    idx === -1 ? 'Kapalı saatler' :
    SLOTS[idx][3] + (manual ? ' · manuel' : ' · '+fmt(SLOTS[idx][0])+'–'+fmt(SLOTS[idx][1]));
  document.getElementById('slotSub').textContent = idx === -1 ? "Yayın 08:00'de başlar" : SLOTS[idx][4];
  document.getElementById('nowBox').classList.toggle('playing', audios.some(a=>!a.paused && a.src));
  document.querySelectorAll('#schedule .row').forEach((r,i)=>r.classList.toggle('active', i===idx));
}
function renderSchedule(){
  document.getElementById('schedule').innerHTML = SLOTS.map(s=>{
    const n = (library[s[2]]||[]).length;
    return '<div class="row"><span>'+fmt(s[0])+'–'+fmt(s[1])+' · '+s[3]+'</span><span class="tag">'+n+' parça</span></div>';
  }).join('');
  const total = Object.values(library).reduce((a,v)=>a+v.length,0);
  document.getElementById('foot').textContent = total+' parça · ilk çalışta indirilir, sonra cihazdan çalar. Ekranı açık/şarjda tut.';
}

// ---------- KONTROLLER ----------
document.getElementById('toggleBtn').onclick = function(){
  started = !started;
  this.textContent = started ? '⏸ Durdur' : '▶ Başlat';
  if (started) playNext('reshuffle'); else stopAll();
};
document.getElementById('skipBtn').onclick = ()=>{ if (started) playNext(); };
document.getElementById('dislikeBtn').onclick = function(){
  if (!currentTrack) return;
  dislikes.add(currentTrack.file);
  saveDislikes();
  renderDisCount();
  if (document.getElementById('disPanel').classList.contains('open')) renderDisPanel();
  this.textContent = '👎 Eklendi';
  setTimeout(()=>{ this.textContent = '👎 Beğenmedim'; }, 1200);
  if (started) playNext();
};
document.getElementById('disListBtn').onclick = ()=>{
  const p = document.getElementById('disPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) renderDisPanel();
};
document.getElementById('vol').oninput = function(){
  masterVol = this.value/100;
  document.getElementById('volLabel').textContent = this.value+'%';
  if (currentSlotIdx !== -1) audios[active].volume = SLOTS[currentSlotIdx][5]*masterVol;
};

// ---------- BAŞLAT (açılış) ----------
const startBtn = document.getElementById('startBtn');
startBtn.onclick = ()=>{
  document.getElementById('intro').hidden = true;
  document.getElementById('player').hidden = false;
  started = true;
  document.getElementById('toggleBtn').textContent = '⏸ Durdur';
  renderMoods(); renderSchedule(); renderDisCount();
  playNext('reshuffle');
  acquireWakeLock();
};

// ---------- AÇILIŞTA MANIFEST YÜKLE ----------
(async ()=>{
  try{
    const total = await loadManifest();
    document.getElementById('introText').textContent = total + ' parça hazır. Başlat\'a bas.';
    startBtn.disabled = false;
  }catch(e){
    document.getElementById('introText').textContent = 'Liste yüklenemedi.';
    document.getElementById('err').textContent = 'İnternet bağlantısını kontrol et. (' + e.message + ')';
  }
})();
</script>
